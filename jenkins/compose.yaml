name: curriculum-assignment5
services:
  jenkins:
    build: .
    image: curriculum-jenkins:assignment5
    container_name: curriculum-jenkins
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Create the local .env file first}
      REPOSITORY_URL: https://github.com/aluakrr/neo4j-curriculum-research-tool.git
      REPOSITORY_BRANCH: assignment5-devops
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
