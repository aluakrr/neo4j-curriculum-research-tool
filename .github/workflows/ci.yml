name: CI

on:
  push:
    branches: [main, assignment-5-devops]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile source files
        run: python -m compileall -q src
      - name: Run static checks
        run: ruff check src tests
      - name: Run automated tests
        run: pytest

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Jenkins Compose configuration
        run: docker compose -f compose.jenkins.yml config --quiet
      - name: Build test image
        run: docker build --target test -t curriculum-graph:test .
      - name: Compile lint and test inside Docker
        run: docker run --rm --entrypoint sh curriculum-graph:test -c "python -m compileall -q src && ruff check src tests && pytest"
      - name: Build runtime image
        run: docker build --target runtime -t curriculum-graph:${{ github.sha }} .
      - name: Run container smoke test
        run: docker run --rm curriculum-graph:${{ github.sha }}
